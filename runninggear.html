<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATO RUNNING GEAR | Elite Performance</title>
    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #080808;
            --bg-secondary: #121212;
            --accent: #d4ff00; /* Neon Lime */
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border: #222222;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navbar Elegant Design */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 50px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--accent);
            font-size: 1.8rem;
            line-height: 0;
        }

        .logo-sub {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .cart-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.65rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero Section */
        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(180deg, rgba(8,8,8,0.2) 0%, rgba(8,8,8,0.9) 100%), url('https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
            padding: 0 20px;
            margin-top: 85px;
        }

        .hero-content h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-content h1 span {
            color: var(--accent);
        }

        .hero-content p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 580px;
            margin: 0 auto 30px auto;
            font-weight: 300;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 15px 35px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
            text-transform: uppercase;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 255, 0, 0.25);
        }

        /* Container & Katalog */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 50px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--text-main);
            color: var(--bg-primary);
            border-color: var(--text-main);
        }

        /* Grid Produk */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: #333;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .product-image {
            height: 300px;
            width: 100%;
            overflow: hidden;
            background: #181818;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-image img {
            transform: scale(1.06);
        }

        .product-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-brand {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Styling Pilihan Size */
        .size-section {
            margin-bottom: 15px;
        }

        .size-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .size-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .size-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Space Grotesk', sans-serif;
        }

        .size-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .size-btn.selected {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 700;
        }

        .add-to-cart {
            margin-top: auto;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-to-cart:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 420px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 2000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-cart:hover {
            color: var(--text-main);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px 30px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .cart-item img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            background: #181818;
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .cart-item-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
        }

        .cart-footer {
            padding: 25px 30px;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.15rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media(max-width: 768px) {
            .hero-content h1 { font-size: 2.5rem; }
            .cart-drawer { width: 100%; right: -100%; }
            .nav-container, .container { padding: 20px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                NATO<span>.</span>
                <span class="logo-sub">Running Gear</span>
            </a>
            <div class="nav-icons">
                <button class="cart-btn" id="cartToggleBtn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Engineered For <span>Speed</span></h1>
            <p>Temukan koleksi perlengkapan lari eksklusif pilihan dari merek-merek elit dunia untuk menemani setiap langkah dan rekor terbaikmu.</p>
            <a href="#shop" class="btn-primary">Eksplor Katalog</a>
        </div>
    </section>

    <!-- Main Content Katalog -->
    <div class="container" id="shop">
        <div class="section-header">
            <h2 class="section-title">Katalog Produk</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="shoes">Sepatu</button>
                <button class="filter-btn" data-filter="apparel">Apparel</button>
            </div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Cart Drawer -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Keranjang Belanja</h3>
            <button class="close-cart" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalPrice">Rp 0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
        </div>
    </div>

    <!-- JavaScript Logika & Database Produk dengan Size -->
    <script>
        const products = [
            { id: 1, name: "Adidas Adizero Adios Pro 3", brand: "Adidas", category: "shoes", price: 3300000, image: "image/adp3.jpeg", sizes: ["40", "41", "42", "43", "44"] },
            { id: 2, name: "Nike Alphafly 3", brand: "Nike", category: "shoes", price: 3999000, image: "image/nike apf 3.jpeg", sizes: ["40", "41", "42", "43", "44", "45"] },
            { id: 3, name: "Asics Gel-Kayano 30", brand: "Asics", category: "shoes", price: 2499000, image: "image/gelkayano.jpeg", sizes: ["39", "40", "41", "42", "43"] },
            { id: 4, name: "Hoka Clifton 9", brand: "Hoka", category: "shoes", price: 2299000, image: "image/hoka.jpeg", sizes: ["40", "41", "42", "43"] },
            { id: 5, name: "Saucony Endorphin Speed 3", brand: "Saucony", category: "shoes", price: 2699000, image: "image/saucony.jpeg", sizes: ["41", "42", "43", "44"] },
            { id: 6, name: "Puma Deviate Nitro 2", brand: "Puma", category: "shoes", price: 2399000, image: "image/puma.jpeg", sizes: ["40", "41", "42", "43", "44"] },
            { id: 7, name: "NATO Elite Lightweight Singlet", brand: "NATO Apparel", category: "apparel", price: 399000, image: "image/singlet.jpeg", sizes: ["S", "M", "L", "XL"] },
            { id: 8, name: "NATO Pro 2-in-1 Running Shorts", brand: "NATO Apparel", category: "apparel", price: 450000, image: "image/running short.jpeg", sizes: ["S", "M", "L", "XL"] }
        ];

        let cart = [];

        function formatIDR(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        }

        const productGrid = document.getElementById('productGrid');
        function renderProducts(filter = 'all') {
            productGrid.innerHTML = '';
            const filteredProducts = filter === 'all' ? products : products.filter(p => p.category === filter);

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.classList.add('product-card');
                
                // Buat HTML pilihan size secara dinamis
                let sizesHTML = '';
                if (product.sizes && product.sizes.length > 0) {
                    sizesHTML = `
                        <div class="size-section">
                            <span class="size-label">Pilih Ukuran (Size):</span>
                            <div class="size-options" id="sizes-${product.id}">
                                ${product.sizes.map((size, index) => `
                                    <button class="size-btn ${index === 0 ? 'selected' : ''}" onclick="selectSize(${product.id}, '${size}', this)">${size}</button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <span class="product-brand">${product.brand}</span>
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">${formatIDR(product.price)}</div>
                        ${sizesHTML}
                        <button class="add-to-cart" onclick="addToCart(${product.id})">+ Tambah ke Keranjang</button>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Fungsi saat tombol size diklik
        function selectSize(productId, size, element) {
            const container = document.getElementById(`sizes-${productId}`);
            const buttons = container.querySelectorAll('.size-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProducts(btn.getAttribute('data-filter'));
            });
        });

        const cartDrawer = document.getElementById('cartDrawer');
        const overlay = document.getElementById('overlay');
        const cartToggleBtn = document.getElementById('cartToggleBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartCount = document.getElementById('cartCount');
        const cartTotalPrice = document.getElementById('cartTotalPrice');

        cartToggleBtn.addEventListener('click', () => {
            cartDrawer.classList.add('open');
            overlay.classList.add('active');
        });

        closeCartBtn.addEventListener('click', closeCart);
        overlay.addEventListener('click', closeCart);

        function closeCart() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            
            // Ambil size yang sedang dipilih user di kartu produk tersebut
            let selectedSize = product.sizes ? product.sizes[0] : '-';
            if (product.sizes) {
                const container = document.getElementById(`sizes-${productId}`);
                const selectedCard = container.querySelector('.size-btn.selected');
                if (selectedCard) {
                    selectedSize = selectedCard.innerText;
                }
            }

            // Cek apakah item dengan ID dan SIZE yang sama sudah ada di keranjang
            const existingItem = cart.find(item => item.id === productId && item.size === selectedSize);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, size: selectedSize, quantity: 1 });
            }
            
            updateCart();
            cartDrawer.classList.add('open');
            overlay.classList.add('active');
        }

        function updateCart() {
            cartItemsContainer.innerHTML = '';
            let totalItems = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Keranjang kosong.</p>`;
            } else {
                cart.forEach(item => {
                    totalItems += item.quantity;
                    totalPrice += item.price * item.quantity;

                    const cartItem = document.createElement('div');
                    cartItem.classList.add('cart-item');
                    cartItem.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-details">
                            <h4>${item.name}</h4>
                            <p>Size: <b>${item.size}</b> | ${formatIDR(item.price)} x ${item.quantity}</p>
                        </div>
                    `;
                    cartItemsContainer.appendChild(cartItem);
                });
            }

            cartCount.innerText = totalItems;
            cartTotalPrice.innerText = formatIDR(totalPrice);
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("Keranjang kamu masih kosong!");
                return;
            }
            let message = "Halo Kak, saya ingin memesan running gear dari *NATO Running Gear*:\n\n";
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.name} (Size: *${item.size}*) (${item.quantity}x) - ${formatIDR(item.price * item.quantity)}\n`;
                total += item.price * item.quantity;
            });
            message += `\n*Total Keseluruhan: ${formatIDR(total)}*\n\nMohon informasi ketersediaan stok dan pembayarannya. Terima kasih!`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/6281234567890?text=${encodedMessage}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
